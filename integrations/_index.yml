# Coefficient Works integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in coefficient-works-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: coefficient-works-salesforce-appexchange-security-review
  label: Salesforce AppExchange Security Review
  partner: salesforce
  partner_name: Salesforce AppExchange Security Review
  category: AppExchange security-reviewed publisher
  type: register
  channel: standard-directory
  evidence: https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/security_review_overview.htm
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Salesforce AppExchange public listings (listing JSON) under the AgentExchange Security Review requirement
    standard: Salesforce AppExchange Security Review
    spec_file: null
    role: security-reviewed-publisher
    registered_name: Coefficient
    register_country: null
    matched_domain: coefficient.io
    matched_by: domain
    identity_source: the listing's own publisher.website (no lookup)
    certified_products:
    - product: Salesforce Platform API solution (security-reviewed)
      product_type: salesforce-platform/api
      certifier: Salesforce (AgentExchange / AppExchange Security Review)
      listings: 1
      example_listing: https://appexchange.salesforce.com/appxListingDetail?listingId=a0N4V00000GYgWXUA1
      latest_approval: '2021-08-18'
      lapsed: false
      lapsed_note: the listing JSON prints solution.securityReview.approvalDate on a LIVE public listing; Salesforce
        publishes no expiry, so no entry is marked lapsed (latest_approval is context)
    signal_note: certified_products = ONE entry per product type (listing technology) with a printed securityReview.approvalDate,
      never per listing or version; a listing with no approval date reads nothing; listing counts / versions are
      context
    requirement: https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/security_review_overview.htm
    detected_by: sweep-salesforce-appexchange.py
    detected: '2026-10-21'
  status: not-a-workflow
  arazzo: null
