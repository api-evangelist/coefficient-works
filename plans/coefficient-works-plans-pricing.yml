notes: >-
  Read verbatim from the public pricing page on 2026-08-14. Coefficient publishes
  four self-serve tiers with quota-based limits; there is no metered overage
  published for any tier — quotas are hard monthly caps on refreshes, exports and
  alerts. Prices shown are the MONTHLY list prices; the page also offers an annual
  toggle advertised as "Save 17% annually" (the discounted annual figures are
  rendered client-side and were not captured). Pro is priced per user with a hard
  5-user ceiling. These are PRODUCT plans for the Google Sheets add-on and Excel
  add-in — Coefficient publishes no developer API and therefore no API pricing.
