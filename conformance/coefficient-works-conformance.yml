name: Coefficient conformance and compliance posture
notes: >-
  Coefficient publishes no machine-readable API description, so nothing here is
  derived from a spec — every entry below is either an explicit first-party claim
  on a Coefficient-controlled page, or a recorded absence. Third-party vendor-risk
  aggregators list Coefficient against a much longer certification set (ISO 27001,
  PCI, HIPAA, FedRAMP, CSA STAR); NONE of those are claimed by Coefficient on its
  own surfaces and none are recorded here. SOC 2 is the only certification
  Coefficient asserts for itself, and even that is gated: the audit report is not
  published, only made available on request through support.
