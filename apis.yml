aid: coefficient-works
name: Coefficient Works
description: 'Coefficient Works, Inc. (operating as Coefficient) is a San Mateo, California
  no-code data platform that connects live business data to Google Sheets and Microsoft
  Excel. Founded in 2019 by Navneet Loiwal and Tommy Tsai, the company provides point-and-click
  connectors to 60+ business systems including Salesforce, HubSpot, NetSuite, QuickBooks,
  Snowflake, MySQL, Stripe, Looker, Tableau and Google Ads, with scheduled two-way
  sync, spreadsheet-native alerting through Slack and email, live web dashboards,
  and an AI assistant that builds pivot tables, formulas, charts and data-cleaning
  steps from natural language. Coefficient is a consumer of other providers'' APIs
  rather than a producer: as of this enrichment pass it publishes no public developer
  API, no OpenAPI or AsyncAPI description, no client SDKs, and no developer portal,
  and its "Connect Any API" feature is a consumer-side HTTP client (GET/POST, bearer
  token / API key / basic auth, cursor, offset and page-number pagination) that writes
  third-party API responses into a sheet. The one programmatic surface Coefficient
  serves is an inbound webhook trigger URL, issued per import on the Pro and Enterprise
  plans, that an external system calls to force an immediate refresh — capped at 12
  calls per hour with a five-minute minimum interval. Coefficient states it is SOC 2
  compliant and provides the audit report on request. Distribution is through the
  Google Workspace Marketplace and Microsoft AppSource. The company is backed by
  Battery Ventures, Foundation Capital and S28 Capital.'
