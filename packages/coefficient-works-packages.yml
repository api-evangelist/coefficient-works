name: Coefficient client libraries and distribution
notes: >-
  An honest zero. Coefficient publishes NO first-party client library in any public
  package registry — searched npm (registry.npmjs.org direct lookups for
  `coefficient`, `coefficient-io`, `@coefficient/sdk` and a registry search for
  `coefficient.io`), PyPI, RubyGems, crates.io, NuGet, Maven Central and
  pkg.go.dev. This is consistent with the product shape: Coefficient is consumed
  as a spreadsheet add-on, not as a library a developer imports, and it publishes
  no developer API for a library to wrap. The company's GitHub org (github.com/coeff)
  holds three public Python repos and none of them is a Coefficient SDK.
  No `SDKs` pointer is wired in apis.yml because there is no SDK to point at.
